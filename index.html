<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Amazon Basin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="map"></div>
    <div id="ui">
      <div id="brand">The Amazon Basin<span>An Amazon river and tributaries explorer</span></div>
      <div id="controls">
        <button id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
        <label id="visible-control" title="Width of the strip of land shown either side of every river">
          <span>Visible Land <b id="visible-value">75%</b></span>
          <input id="visible" type="range" min="15" max="100" step="5" value="75" />
        </label>
        <label id="trails-control" title="Show the river network as lines">
          <input id="trails" type="checkbox" />
          <span class="box" aria-hidden="true"></span>
          River Trails
        </label>
        <button id="snapshot" type="button" title="Save the current view as a PNG, without the interface">Take snapshot</button>
      </div>
    </div>
    <aside id="river-panel" hidden aria-live="polite">
      <div class="head">
        <h2 id="rp-name">River</h2>
        <button id="rp-close" type="button" aria-label="Close">×</button>
      </div>
      <p id="rp-water" class="water" hidden></p>
      <p id="rp-note" class="water" hidden></p>
      <table>
        <tbody id="rp-rows"></tbody>
      </table>
      <p class="note">Discharge, population and flooding are modelled long-term averages (HydroATLAS, 1971–2000); length and elevation from the HydroRIVERS network.</p>
    </aside>
    <div id="loading">Loading river grid…</div>
    <div id="hint">scroll to zoom · drag to pan · smaller rivers appear as you zoom in</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
