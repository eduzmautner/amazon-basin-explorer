<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon River Explorer</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="ui">
      <div id="brand">Amazon<span>River Explorer</span></div>
      <div id="controls">
        <button id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
        <label id="visible-control" title="Width of the strip of land shown either side of every river">
          <span>visible land <b id="visible-value">75%</b></span>
          <input id="visible" type="range" min="15" max="100" step="1" value="75" />
        </label>
      </div>
    </div>
    <div id="loading">loading river grid</div>
    <div id="hint">scroll to zoom · drag to pan · smaller rivers appear as you zoom in</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
